# CI (doc 05): Phase 0 gates, typecheck, tests, duplication, production build + smoke, dependency audit, Trivy, and a
# Docker build without push.
# Actions are pinned by full commit SHA (the comment says which release); bump SHA and comment together.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, test, build, smoke, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Phase 0 gates (docs/engineering/conventions.md). ESLint and dependency-cruiser are deferred while the repo is on
      # TypeScript 7 (no JS compiler API); scripts/scan/declaration-rules.mjs checks the one-declaration-kind rules.
      - name: Declaration rules (one declaration kind per file)
        run: pnpm lint:declarations

      - name: Language (English outside i18n catalogs and localized data)
        run: pnpm lint:language

      # Biome and knip report only until the pre-existing findings are cleared (see docs/engineering/tooling.md).
      - name: Biome (report only)
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # jsx-a11y rules (oxlint): static accessibility checks of the React markup.
      - name: Accessibility lint
        run: pnpm lint:a11y

      # plan/ is gitignored: the prototype-based tests and the db seed skip without it; web fixtures are committed.
      - name: Test
        run: pnpm test

      - name: Duplication (jscpd, threshold 1 %)
        run: pnpm dup

      - name: Dead code (knip, report only)
        continue-on-error: true
        run: pnpm deadcode

      - name: Build (production, real API)
        run: pnpm build
        env:
          VITE_DATA_SOURCE: http

      # Initial JS per route (entry + page chunk, gzip) and the stylesheet: fails on a regression above the budget.
      - name: Bundle budget
        run: pnpm perf:budget

      # Starts apps/server/dist/main.js with NODE_ENV=production on an in-memory PGlite and dummy CI secrets.
      - name: Smoke test of the production build
        run: bash scripts/ci/smoke.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Filesystem vulnerability scan: fails on HIGH/CRITICAL findings that have a fix available.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: plan,data,node_modules

  lighthouse:
    name: Lighthouse (mobile, slow 4G, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (production, real API)
        run: pnpm build
        env:
          VITE_DATA_SOURCE: http

      # lighthouserc.json: Moto-class phone, simulated slow 4G (150 ms RTT, 1.6 Mbps, CPU ×4), median of 3 runs on
      # /, /athletes, /athletes/pele, /sports and /contact (Lighthouse 13 via @lhci/cli 0.16). Fails on accessibility < 100,
      # best practices or SEO < 95, performance < 90, LCP > 2.5 s, CLS > 0.1 or TBT > 300 ms. The athlete profile (LCP = the
      # portrait image) is a regression guard instead: score ≥ 80, LCP ≤ 5 s. The simulated model adds every early request
      # to an image LCP; with real throttling (devtools) the same page measures LCP ≈ 2.2 s. Reports are kept as an artifact.
      - name: Lighthouse CI
        run: pnpm perf:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14

  docker:
    name: Docker image (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: world-all-stars:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same smoke as the verify job, against the container (empty PGlite volume, dummy CI secrets).
      - name: Smoke test of the image
        run: |
          docker run -d --name was -p 8799:8787 \
            -e IP_HASH_SALT=ci-smoke-salt-not-a-secret \
            -e BETTER_AUTH_SECRET=ci-smoke-better-auth-secret-not-a-secret-000 \
            -e PUBLIC_URL=http://127.0.0.1:8799 \
            world-all-stars:ci
          BASE_URL=http://127.0.0.1:8799 bash scripts/ci/smoke.sh || { docker logs was; exit 1; }
          docker inspect --format '{{.Config.User}} {{json .Config.Healthcheck.Test}}' world-all-stars:ci

      - name: Stop container
        if: always()
        run: docker rm -f was || true
